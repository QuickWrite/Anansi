services:
  anansi:
    image: ghcr.io/quickwrite/anansi:latest
    container_name: anansi-app
    ports:
      - "8080:8080"
    environment:
      # Optional envirnonment variables
      # If they aren't provided, they assume these provided defaults
      ANANSI_PATH: /data/default.txt
      ANANSI_LIMIT: 1000
      ANANSI_PORT: 8080
      ANANSI_LINK_PROBABILITY: 5
      ANANSI_MIN_LINK_LENGTH: 4
    volumes:
      - anansi-data:/data:ro
    restart: unless-stopped

volumes:
  anansi-data:
